{
	"version": 9,
	"name": "Tremor Invictus",
	"icon": "icon.png",
	"fileformats": [
		{ "format": "Quake3" },
		{ "format": "Quake3 (Valve)" }
	],
	"filesystem": {
		"searchpath": "baseq3",
		"packageformat": { "extension": ".pk3", "format": "zip" }
	},
	"materials": {
		"root": "textures",
		"extensions": [ ".tga", ".png", ".jpg", ".jpeg" ],
		"shaders": "scripts",
		"excludes": [ "*_norm", "*_gloss", "*_glow" ]
	},
	"entities": {
		"definitions": [ "tremor-invictus.fgd" ],
		"defaultcolor": "0.6 0.6 0.6 1.0",
		"setDefaultProperties": true
	},
	"tags": {
		"brush": [
			{ "name": "Trigger", "attribs": [ "transparent" ], "match": "classname", "pattern": "trigger*" }
		],
		"brushface": [
			{ "name": "Clip", "attribs": [ "transparent" ], "match": "material", "pattern": "common/*clip" },
			{ "name": "Caulk", "match": "material", "pattern": "common/caulk" },
			{ "name": "Hint", "attribs": [ "transparent" ], "match": "material", "pattern": "common/hint*" },
			{ "name": "Skip", "attribs": [ "transparent" ], "match": "material", "pattern": "common/skip" },
			{ "name": "Detail", "match": "contentflag", "flags": [ "detail" ] }
		]
	},
	"faceattribs": {
		"defaults": { "scale": [ 0.5, 0.5 ] },
		"surfaceflags": [
			{ "name": "nodamage", "description": "No falling damage on this surface" },
			{ "name": "slick", "description": "Low friction" },
			{ "name": "sky", "description": "Sky; the hook can't hold here" },
			{ "name": "ladder", "description": "Climbable" },
			{ "name": "noimpact", "description": "Projectiles vanish without an impact" },
			{ "name": "nomarks", "description": "No impact marks" },
			{ "name": "flesh", "description": "Flesh sounds" },
			{ "name": "nodraw", "description": "Not drawn" },
			{ "name": "hint", "description": "Visibility hint" },
			{ "name": "skip", "description": "Ignored by the compiler" },
			{ "name": "nolightmap", "description": "No lightmap" },
			{ "name": "pointlight", "description": "Lit per vertex" },
			{ "name": "metalsteps", "description": "Metal footsteps" },
			{ "name": "nosteps", "description": "No footsteps" },
			{ "name": "nonsolid", "description": "Not solid" },
			{ "name": "lightfilter", "description": "Filters light" },
			{ "name": "alphashadow", "description": "Shadows by alpha" },
			{ "name": "nodlight", "description": "No dynamic lights" },
			{ "name": "dust", "description": "Dust on landing" }
		],
		"contentflags": [
			{ "name": "solid", "description": "Solid" },
			{ "name": "lava", "description": "Lava" },
			{ "name": "slime", "description": "Slime" },
			{ "name": "water", "description": "Water" },
			{ "name": "fog", "description": "Fog" },
			{ "name": "notteam1", "unused": true },
			{ "name": "notteam2", "unused": true },
			{ "name": "nobotclip", "unused": true },
			{ "name": "unused1", "unused": true },
			{ "name": "unused2", "unused": true },
			{ "name": "unused3", "unused": true },
			{ "name": "unused4", "unused": true },
			{ "name": "unused5", "unused": true },
			{ "name": "unused6", "unused": true },
			{ "name": "unused7", "unused": true },
			{ "name": "areaportal", "description": "Area portal" },
			{ "name": "playerclip", "description": "Blocks players only" },
			{ "name": "monsterclip", "description": "Blocks monsters only" },
			{ "name": "teleporter", "description": "Teleporter (bots)" },
			{ "name": "jumppad", "description": "Jump pad (bots)" },
			{ "name": "clusterportal", "description": "Cluster portal (bots)" },
			{ "name": "donotenter", "description": "Bots keep out" },
			{ "name": "botclip", "description": "Blocks bots only" },
			{ "name": "mover", "description": "Mover" },
			{ "name": "origin", "description": "Origin brush" },
			{ "name": "body", "unused": true },
			{ "name": "corpse", "unused": true },
			{ "name": "detail", "description": "Detail brush, not part of visibility" },
			{ "name": "structural", "description": "Structural" },
			{ "name": "translucent", "description": "Translucent" },
			{ "name": "trigger", "description": "Trigger" },
			{ "name": "nodrop", "description": "Items don't drop here" }
		]
	}
}
