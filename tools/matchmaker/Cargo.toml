[package]
name = "tremor-matchmaker"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Tremor Invictus matchmaking: queues, Glicko-2 ratings, ready checks, server reservations, signed results"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
ed25519-dalek = "2"
hex = "0.4"
rand = "0.8"
